<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumora Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Glow Background -->
    <div class="blur blur1"></div>
    <div class="blur blur2"></div>

    <!-- Navbar -->
    <header>
        <h1 class="logo">Lumora ✨</h1>

        <button id="theme-toggle">🌙</button>
    </header>

    <!-- Home Section -->
    <section class="home active">

        <div class="glass-card">

            <h2>Welcome to Lumora</h2>

            <p>
                Test your knowledge with our futuristic quiz experience 🚀
            </p>

            <div class="buttons">

                <button class="main-btn" id="start-btn">
                    Start Quiz
                </button>

                <button class="outline-btn" id="joke-btn">
                    Get Joke 😂
                </button>

                <button class="outline-btn" id="carousel-btn">
                    Open Carousel 🖼️
                </button>

            </div>

            <!-- Joke Box -->
            <div id="joke-box"></div>

        </div>

    </section>

    <!-- IMAGE CAROUSEL SECTION -->

    <section class="carousel-section">

        <div class="glass-card">

            <h2>Image Carousel 🖼️</h2>

            <img id="carousel-image" src="https://picsum.photos/id/1015/600/300">

            <div class="carousel-buttons">

                <button onclick="prevImage()">⬅</button>

                <button onclick="nextImage()">➡</button>

                <button onclick="likeImage()">❤️ Like</button>

            </div>

            <p id="liked-count">
                Liked Images: 0
            </p>

            <hr class="divider">

            <h3 class="liked-title">
                Images You Liked:
            </h3>

            <div id="liked-images" class="liked-images"></div>

            <button class="outline-btn home-carousel-btn" onclick="goHome()">

                🏠 Back to Home

            </button>

        </div>

    </section>
    <!-- Quiz Section -->

    <section class="quiz-section">

        <div class="quiz-box glass-card">

            <div class="top-bar">

                <h2>Quiz Time 🧠</h2>

                <span id="score">Score: 0</span>

            </div>

            <div class="progress-container">

                <div class="progress-bar" id="progress-bar"></div>

            </div>

            <h3 id="question">
                Question Here
            </h3>

            <div id="answers"></div>

            <button class="main-btn" id="next-btn">

                Next

            </button>

        </div>

    </section>

    <!-- Result Section -->

    <section class="result-section">

        <div class="glass-card result-box">

            <h1>Quiz Result</h1>

            <div class="circle">

                <div class="inner-circle">

                    <span id="percentage">
                        0%
                    </span>

                </div>

            </div>

            <p id="final-score"></p>

            <div class="buttons">

                <button onclick="location.reload()" class="main-btn">

                    Try Again

                </button>

                <button class="outline-btn" id="home-btn">

                    Home

                </button>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
